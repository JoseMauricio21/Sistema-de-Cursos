name: Actualizar lenguajes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Obtener lenguajes de GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]

          url = f"https://api.github.com/repos/{repo}/languages"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"
              }
          )

          with urllib.request.urlopen(request) as response:
              languages = json.load(response)

          total = sum(languages.values())

          rows = []

          for language, amount in sorted(
              languages.items(),
              key=lambda x: x[1],
              reverse=True
          ):
              percentage = (amount / total) * 100
              rows.append(
                  f"| **{language}** | {percentage:.2f}% |"
              )

          table = "\n".join(rows)

          start = "<!-- LANGUAGES:START -->"
          end = "<!-- LANGUAGES:END -->"

          with open("README.md", "r", encoding="utf-8") as file:
              readme = file.read()

          start_position = readme.find(start)
          end_position = readme.find(end)

          if start_position == -1 or end_position == -1:
              raise Exception(
                  "No se encontraron los marcadores LANGUAGES en README.md"
              )

          end_position += len(end)

          new_content = f"""{start}

          | Lenguaje | Porcentaje |
          |:--------:|:----------:|
          {table}

          {end}"""

          readme = (
              readme[:start_position]
              + new_content
              + readme[end_position:]
          )

          with open("README.md", "w", encoding="utf-8") as file:
              file.write(readme)

          print("Lenguajes encontrados:")
          print(json.dumps(languages, indent=2))
          PY

      - name: Actualizar README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "El README ya está actualizado."
          else
            git commit -m "docs: actualizar lenguajes"
            git push
          fi
