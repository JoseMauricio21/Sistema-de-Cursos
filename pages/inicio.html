<!-- Inicio Section Content -->
<div class="welcome-banner">
    <button class="profile-link-btn" id="profileLinkBtn" title="Ir a mi perfil">
        <img src="../images/logo t.png" alt="Perfil" class="welcome-profile-pic" id="welcomeProfilePic">
    </button>
    <div class="welcome-content">
        <h2 class="welcome-title">Bienvenido</h2>
        <p class="welcome-username" id="welcomeUsername">jose mauricio</p>
    </div>
</div>

<div class="section-header">
    <h2>Dashboard Principal</h2>
    <p class="section-subtitle">Acceso rápido a tus cursos y exámenes</p>
</div>

<div class="stats-grid">
    <div class="stat-card stat-card--blue" onclick="document.querySelector('input[value=\'mis-cursos\']').click()">
        <div class="stat-card__content">
            <div class="stat-card__text">
                <p class="stat-card__label">Mis Cursos</p>
                <p class="stat-card__value" id="statCourses">0</p>
            </div>
            <div class="stat-card__icon">
                <i class="fas fa-book"></i>
            </div>
        </div>
    </div>

    <div class="stat-card stat-card--teal" onclick="document.querySelector('input[value=\'examenes\']').click()">
        <div class="stat-card__content">
            <div class="stat-card__text">
                <p class="stat-card__label">Exámenes</p>
                <p class="stat-card__value" id="statExams">0</p>
            </div>
            <div class="stat-card__icon">
                <i class="fas fa-file-alt"></i>
            </div>
        </div>
    </div>

    <div class="stat-card stat-card--cyan" onclick="document.querySelector('input[value=\'mis-calificaciones\']').click()">
        <div class="stat-card__content">
            <div class="stat-card__text">
                <p class="stat-card__label">Tu Progreso</p>
                <p class="stat-card__value" id="statProgress">0%</p>
            </div>
            <div class="stat-card__icon">
                <i class="fas fa-chart-line"></i>
            </div>
        </div>
    </div>

    <div class="stat-card stat-card--gray">
        <div class="stat-card__content">
            <div class="stat-card__text">
                <p class="stat-card__label">Notificaciones</p>
                <p class="stat-card__value" id="statNotifications">0</p>
            </div>
            <div class="stat-card__icon">
                <i class="fas fa-bell"></i>
            </div>
        </div>
    </div>
</div>
